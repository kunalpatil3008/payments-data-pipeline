name: dbt build

# When this runs:
#   push            every time code is pushed to main
#   schedule        every night at 06:17 UTC
#   workflow_dispatch  a Run button in the Actions tab, for when you want it now
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Run models and tests on Snowflake
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payments_dbt

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install --quiet dbt-snowflake==1.8.*

      - name: Check the connection
        run: dbt debug --profiles-dir ../.github/ci

      - name: Install dbt packages
        run: dbt deps --profiles-dir ../.github/ci

      - name: Build models, then test them
        run: dbt build --profiles-dir ../.github/ci

      - name: Save the run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results
          path: payments_dbt/target/
          retention-days: 7
